<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>El Botín del Mar | Hermandad de la Costa</title>
  <meta name="description" content="Provisiones y botines para los hermanos de la costa. Aceptamos monedas locales e internacionales.">
  
  <!-- Preconnect para acelerar la descarga de tipografías (Performance+) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Fuentes unificadas con el CSS para evitar cargas dobles -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  
  <!-- Script con defer para no bloquear el renderizado del HTML -->
  <script src="app.js" defer></script>
  
  <!-- Estilos del modal refactorizados (cero inline-styles) -->
  <style>
    .modal-prod-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-pirate);
      margin-bottom: 1rem;
    }
    .modal-prod-desc {
      font-family: 'IM Fell English', serif;
      font-size: 1.2rem;
      color: var(--text-parchment);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .modal-prod-extra {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-bright);
    }
  </style>
</head>
<body>

  <header class="pirate-header">
    <div class="logo-area">
      <span class="skull-icon" aria-hidden="true">☠️</span>
      <h1>Hermandad de la Costa</h1>
    </div>
    
    <nav class="lang-selector" aria-label="Selector de idioma">
      <button class="btn-lang" aria-label="Cambiar a Español">🇪🇸 ES</button>
      <button class="btn-lang" aria-label="Cambiar a Inglés">🇬🇧 EN</button>
    </nav>
    
    <button class="cart-trigger" id="cartTrigger" aria-label="Abrir cofre de compras">
      <span aria-hidden="true">📜</span>
      <span class="cart-label">Cofre</span>
      <span class="badge" id="cartCount">0</span>
    </button>
  </header>

  <!-- Modal de Producto -->
  <div id="productModal" class="product-modal" role="dialog" aria-modal="true" aria-labelledby="modalProdTitle">
    <article class="product-content" style="text-align: center;">
      <header class="product-header">
        <h3 id="modalProdTitle"></h3>
        <button class="close-btn" id="closeProductModal" aria-label="Cerrar detalles">&times;</button>
      </header>
      <div class="cart-body">
        <img id="modalProdImg" src="" alt="Imagen del botín" class="modal-prod-image" loading="lazy">
        <p id="modalProdDesc" class="modal-prod-desc"></p>
        <div id="modalProdExtra" class="modal-prod-extra"></div>
      </div>
    </article>
  </div>

  <main class="container">
    <section class="hero-banner">
      <h2 id="hero-title">Suministros & Botines del Mar</h2>
      <p id="hero-subtitle">Selecciona tus provisiones, grumete. Aceptamos monedas locales e internacionales.</p>
    </section>

    <!-- El Grid ahora es una sección semántica -->
    <section class="product-grid" id="productGrid" aria-label="Lista de provisiones">
      <!-- El JS inyectará los productos aquí -->
    </section>
  </main>

  <!-- Modal del Carrito -->
  <div class="cart-modal" id="cartModal" role="dialog" aria-modal="true" aria-labelledby="cart-title-text">
    <aside class="cart-content">
      <header class="cart-header">
        <h3><span aria-hidden="true">💰</span> <span id="cart-title-text">Tu Botín Seleccionado</span></h3>
        <button class="close-btn" id="closeCart" aria-label="Cerrar cofre">&times;</button>
      </header>
      
      <div class="cart-items-container" id="cartItems">
        <!-- Items del carrito -->
      </div>
      
      <footer class="cart-footer">
        <div class="cart-total-row">
          <span>Total:</span>
          <span id="cartTotal">$0 CLP</span>
        </div>
        <button class="btn-checkout" id="checkoutBtn">Pagar con Mercado Pago 💳</button>
      </footer>
    </aside>
  </div>

  <!-- Diccionario de Traducciones -->
  <script>

        stock: "Stock:",

      }

  </script>
</body>
</html>
